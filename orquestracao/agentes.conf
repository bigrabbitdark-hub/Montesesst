# Qual IA cada agente usa. É AQUI que você troca o modelo de um agente.
#
# agente                 provedor   modelo
#
# provedor: claude     -> sua assinatura/login do Claude Code. modelo: opus | sonnet | haiku
#           minimax    -> chave em /root/.montese/minimax.env. modelo: padrao (= MINIMAX_MODEL, hoje MiniMax-M3)
#           openrouter -> chave em /root/.montese/openrouter.env. modelo: padrao (= OPENROUTER_MODEL, um modelo GRÁTIS)
#
# CADEIA DE RESERVA: separe com | . Se o primeiro falhar (erro, limite de uso, sem chave), tenta o próximo.
#   montese-x   openrouter padrao | minimax padrao | claude haiku
# Modelos grátis têm limite diário e podem registrar o que você envia: use só em agentes de baixo risco.
#
# Regra de economia: Claude forte só onde errar custa caro (decidir, proteger dados);
# MiniMax no trabalho volumoso de escrever/ajustar código e analisar.

montese-orquestrador     claude     opus      # chefe: decide e distribui (poucos tokens, alto valor)
montese-planejador       claude     sonnet    # mapeia o código e faz o plano
montese-seguranca        claude     opus      # tenant, RLS, LGPD: erro aqui é caro
montese-banco-rls        claude     sonnet    # migrations e RLS: erro aqui é caro
montese-normativo-ia     claude     sonnet    # normas: não pode inventar
montese-qa               claude     sonnet    # veredito final precisa ser confiável

montese-backend          minimax    padrao    # volume de código NestJS
montese-frontend         minimax    padrao    # volume de código Next.js
montese-performance      openrouter padrao | minimax padrao | claude haiku   # baixo risco: grátis primeiro
montese-infra-release    openrouter padrao | minimax padrao | claude haiku   # só analisa e propõe

# Especialistas de SST (leem os documentos e módulos reais do projeto; Claude Sonnet: não podem inventar norma)
montese-normas              claude     sonnet    # fontes oficiais, vigência, versões, regras em rascunho
montese-rag-qualidade       claude     sonnet    # testa o Assistente: citação, incerteza, versões, adversarial
montese-risco-ocupacional   claude     sonnet    # PGR/GRO, LIP, LTCAT, PCMSO/ASO: lacunas e divergências
montese-auditor-documentos  claude     sonnet    # Pente-Fino: evidência com origem e confiança
montese-esocial             claude     sonnet    # S-2210, S-2220, S-2240: analisa, nunca envia
