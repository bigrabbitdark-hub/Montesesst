services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: montese_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # SEM "ports:" -> não acessível fora da rede Docker (regra não-negociável)

  redis:
    image: redis:7-alpine
    container_name: montese_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    expose: ["6379"]

  backend:
    build:
      context: ./backend
    container_name: montese_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: production
      PORT: "4000"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_POOL_CONN_TIMEOUT_MS: ${DB_POOL_CONN_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-5}
      REGISTER_RATE_LIMIT_WINDOW_SECONDS: ${REGISTER_RATE_LIMIT_WINDOW_SECONDS:-3600}
      CONTACT_RATE_LIMIT_MAX: ${CONTACT_RATE_LIMIT_MAX:-10}
      CONTACT_RATE_LIMIT_WINDOW_SECONDS: ${CONTACT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_RAG_MIN_SIMILARITY: ${OPENROUTER_RAG_MIN_SIMILARITY:-0.4}
      AI_DRAFT_RATE_LIMIT_MAX: ${AI_DRAFT_RATE_LIMIT_MAX:-20}
      AI_DRAFT_RATE_LIMIT_WINDOW_SECONDS: ${AI_DRAFT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ASSISTANT_RATE_LIMIT_MAX: ${ASSISTANT_RATE_LIMIT_MAX:-20}
      ASSISTANT_RATE_LIMIT_WINDOW_SECONDS: ${ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ASSISTANT_ATTACHMENT_RATE_LIMIT_MAX: ${ASSISTANT_ATTACHMENT_RATE_LIMIT_MAX:-10}
      ASSISTANT_ATTACHMENT_RATE_LIMIT_WINDOW_SECONDS: ${ASSISTANT_ATTACHMENT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      DOCUMENTS_CLASSIFY_BATCH_RATE_LIMIT_MAX: ${DOCUMENTS_CLASSIFY_BATCH_RATE_LIMIT_MAX:-5}
      DOCUMENTS_CLASSIFY_BATCH_RATE_LIMIT_WINDOW_SECONDS: ${DOCUMENTS_CLASSIFY_BATCH_RATE_LIMIT_WINDOW_SECONDS:-3600}
      PENTE_FINO_RUN_RATE_LIMIT_MAX: ${PENTE_FINO_RUN_RATE_LIMIT_MAX:-5}
      PENTE_FINO_RUN_RATE_LIMIT_WINDOW_SECONDS: ${PENTE_FINO_RUN_RATE_LIMIT_WINDOW_SECONDS:-3600}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      ATA_AUDIO_RATE_LIMIT_MAX: ${ATA_AUDIO_RATE_LIMIT_MAX:-10}
      ATA_AUDIO_RATE_LIMIT_WINDOW_SECONDS: ${ATA_AUDIO_RATE_LIMIT_WINDOW_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal]
    expose: ["4000"]

  frontend:
    build:
      context: ./frontend
    container_name: montese_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      NODE_ENV: production
    depends_on: [backend]
    networks: [internal]
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    container_name: montese_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
    depends_on: [backend, frontend]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
