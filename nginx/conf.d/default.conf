# --- Montese Leads (painel em /leadsmontesesst): contexto http -----------------------------------------------
# Só o cookie do Leads atravessa para o mleads_api: os cookies do Montese SST (Path=/) nunca chegam lá.
map $http_cookie $mleads_cookie {
    default "";
    "~(?:^|;\s*)(mleads_ui=[A-Za-z0-9_-]+)" $1;
}
# Limites por IP do cliente: geral e, mais apertado, o login (o app também limita: 10 logins/min por IP).
limit_req_zone $binary_remote_addr zone=mleads_ui:5m rate=120r/m;
limit_req_zone $binary_remote_addr zone=mleads_login:2m rate=10r/m;
# Registro SEM query string (filtros e CNPJ de leads não ficam no log do Nginx).
log_format mleads '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
# --------------------------------------------------------------------------------------------------------------

upstream backend_upstream {
    server backend:4000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name montesesst.com.br www.montesesst.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name montesesst.com.br www.montesesst.com.br;

    client_max_body_size 110m;

    ssl_certificate /etc/letsencrypt/live/montesesst.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montesesst.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # F-20: cabeçalhos de segurança complementares ao helmet do NestJS.
    # Helmet cuida de HSTS, X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy e remove X-Powered-By. O nginx adiciona CSP e
    # Permissions-Policy (escopo mais amplo, vale também para o frontend
    # estático servido daqui, onde helmet não roda). always = garante que
    # o header sai mesmo em respostas 4xx/5xx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.resend.com https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'self'" always;

    # --- Montese Leads (painel) -------------------------------------------------------------------------------
    location = /leadsmontesesst {
        return 301 /leadsmontesesst/;
    }

    location = /leadsmontesesst/login {
        # Nome resolvido em TEMPO DE REQUISIÇÃO (resolver do Docker + variável): com o Leads parado ou a rede mleads_edge
        # desanexada, o Nginx do Montese SST continua subindo/recarregando; só esta rota responde 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 3s;
        set $mleads_upstream http://mleads_api:8000;
        rewrite ^/leadsmontesesst/(.*)$ /ui/$1 break;      # o app serve em /ui; só /ui é alcançável (nunca /v1)
        proxy_pass $mleads_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;                       # a guarda de Origem do app compara Origin com Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;     # sobrescreve: o cliente não forja o próprio IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $mleads_cookie;            # só mleads_ui
        proxy_set_header Range "";                         # sem Range no estático (Starlette 0.41.3; INFERIDO)
        proxy_set_header If-Range "";
        proxy_set_header Connection "";
        client_max_body_size 64k;                          # o app recusa > 64 KB; o server tem 110m para o Montese SST
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        limit_req zone=mleads_login burst=5 nodelay;   # POST/GET do login: 10/min por IP (+5 de rajada)
        limit_req_status 429;
        access_log /dev/stdout mleads;
        # SEM add_header aqui: HSTS, nosniff, X-Frame-Options, Permissions-Policy e CSP do server seguem herdados.
    }

    location /leadsmontesesst/ {
        # Nome resolvido em TEMPO DE REQUISIÇÃO (resolver do Docker + variável): com o Leads parado ou a rede mleads_edge
        # desanexada, o Nginx do Montese SST continua subindo/recarregando; só esta rota responde 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 3s;
        set $mleads_upstream http://mleads_api:8000;
        rewrite ^/leadsmontesesst/(.*)$ /ui/$1 break;      # o app serve em /ui; só /ui é alcançável (nunca /v1)
        proxy_pass $mleads_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;                       # a guarda de Origem do app compara Origin com Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;     # sobrescreve: o cliente não forja o próprio IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $mleads_cookie;            # só mleads_ui
        proxy_set_header Range "";                         # sem Range no estático (Starlette 0.41.3; INFERIDO)
        proxy_set_header If-Range "";
        proxy_set_header Connection "";
        client_max_body_size 64k;                          # o app recusa > 64 KB; o server tem 110m para o Montese SST
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        limit_req zone=mleads_ui burst=40 nodelay;     # 120/min por IP (+40 de rajada)
        limit_req_status 429;
        access_log /dev/stdout mleads;
        # SEM add_header aqui: HSTS, nosniff, X-Frame-Options, Permissions-Policy e CSP do server seguem herdados.
    }
    # ----------------------------------------------------------------------------------------------------------

    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default de 60s estourava em aprovação/reindexação de normas
        # grandes (Fase 9) — cada pedaço de texto gera uma chamada de
        # embedding sequencial (~200 pedaços numa norma extensa como a
        # NR-12 levam mais de 1 minuto). O backend termina o trabalho
        # normalmente mesmo quando o cliente recebe 504 — mas isso
        # aparece pro admin como falha quando na verdade funcionou.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
