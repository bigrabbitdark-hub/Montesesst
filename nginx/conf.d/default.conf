upstream backend_upstream {
    server backend:4000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name montesesst.com.br www.montesesst.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name montesesst.com.br www.montesesst.com.br;

    client_max_body_size 110m;

    ssl_certificate /etc/letsencrypt/live/montesesst.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montesesst.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # F-20: cabeçalhos de segurança complementares ao helmet do NestJS.
    # Helmet cuida de HSTS, X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy e remove X-Powered-By. O nginx adiciona CSP e
    # Permissions-Policy (escopo mais amplo, vale também para o frontend
    # estático servido daqui, onde helmet não roda). always = garante que
    # o header sai mesmo em respostas 4xx/5xx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.resend.com https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default de 60s estourava em aprovação/reindexação de normas
        # grandes (Fase 9) — cada pedaço de texto gera uma chamada de
        # embedding sequencial (~200 pedaços numa norma extensa como a
        # NR-12 levam mais de 1 minuto). O backend termina o trabalho
        # normalmente mesmo quando o cliente recebe 504 — mas isso
        # aparece pro admin como falha quando na verdade funcionou.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
